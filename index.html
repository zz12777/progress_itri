<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進度管理_冠竹</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e6e3dc;
    --ok:#1f7a5a; --okbg:#e3f3ec; --wait:#8a6d1f; --waitbg:#fbf1d6; --bad:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  h1{font-size:24px;margin:0;letter-spacing:.5px}
  .upd{color:var(--mute);font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--mute);font-size:13px}
  nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:var(--card);padding:7px 16px;border-radius:999px;
    font:inherit;cursor:pointer;color:var(--ink)}
  nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  section{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;overflow-x:auto}
  section.on{display:block}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  th{font-size:13px;color:var(--mute);font-weight:600}
  td.n{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px}
  .ok{background:var(--okbg);color:var(--ok)}
  .wait{background:var(--waitbg);color:var(--wait)}
  .over{color:var(--bad);font-weight:600}
  .meet{padding:14px 18px;border-bottom:1px solid var(--line)}
  .meet:last-child{border-bottom:none}
  .meet h3{margin:0 0 6px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meet h3 small{color:var(--mute);font-weight:400;font-size:13px}
  .meet ol{margin:0;padding-left:20px}
  .empty{padding:18px;color:var(--mute)}
  .fee{padding:14px 18px;display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid var(--line)}
  .fee div b{font-variant-numeric:tabular-nums}
  @media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>進度管理_冠竹</h1>
    <div class="upd" id="upd"></div>
  </header>

  <div class="stats" id="stats"></div>

  <nav id="nav">
    <button data-t="prog" class="on">進度</button>
    <button data-t="todo">待辦</button>
    <button data-t="meet">會議紀錄</button>
    <button data-t="pay">給錢紀錄</button>
  </nav>

  <section id="prog" class="on"></section>
  <section id="todo"></section>
  <section id="meet"></section>
  <section id="pay"></section>
</div>

<script>
function render(){
const $ = id => document.getElementById(id);
const money = n => "$" + n.toLocaleString("en-US");
const md = d => { const [, m, day] = d.split("-"); return +m + "/" + +day; };
const tag = done => done ? '<span class="tag ok">冠竹完成</span>' : '<span class="tag wait">待完成</span>';
const MAX_MEET = 2;

$("upd").textContent = "更新 " + DATA.updated;

const meetCount = v => DATA.meetings.filter(m => m.vendor === v).length;
const paid = DATA.payments.filter(p => p.paid).reduce((s, p) => s + p.amount, 0);
const unpaid = DATA.payments.filter(p => !p.paid).reduce((s, p) => s + p.amount, 0);
const openTodos = DATA.todos.filter(t => !t.done).length;

$("stats").innerHTML = [
  [DATA.vendors.length, "廠商"],
  [money(paid), "已給"],
  [money(unpaid), "待給"],
  [openTodos, "待辦"]
].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

// 進度
$("prog").innerHTML = `<table>
  <tr><th>廠商</th>${DATA.stages.map(s => `<th>${s}</th>`).join("")}<th>線上會議</th></tr>
  ${DATA.vendors.map(v => {
    const c = meetCount(v.name);
    return `<tr><td><b>${v.name}</b></td>
      ${v.progress.map(p => `<td>${tag(p)}</td>`).join("")}
      <td class="n ${c > MAX_MEET ? "over" : ""}">${c} / ${MAX_MEET}</td></tr>`;
  }).join("")}
</table>`;

// 待辦
const todos = [...DATA.todos].sort((a, b) => a.done - b.done || b.date.localeCompare(a.date));
$("todo").innerHTML = todos.length ? `<table>
  <tr><th>日期</th><th>廠商</th><th>事項</th><th>狀態</th></tr>
  ${todos.map(t => `<tr><td class="n">${md(t.date)}</td><td>${t.vendor}</td><td>${t.item}</td><td>${tag(t.done)}</td></tr>`).join("")}
</table>` : '<div class="empty">無</div>';

// 會議
const meets = [...DATA.meetings].sort((a, b) => b.date.localeCompare(a.date));
$("meet").innerHTML = meets.length ? meets.map(m => `<div class="meet">
  <h3>${md(m.date)} ${m.vendor}<small>${m.hours} 小時</small></h3>
  <ol>${m.notes.map(n => `<li>${n}</li>`).join("")}</ol>
</div>`).join("") : '<div class="empty">無</div>';

// 給錢
const pays = [...DATA.payments].sort((a, b) => b.date.localeCompare(a.date));
$("pay").innerHTML = `<table>
  <tr><th>日期</th><th>廠商</th><th>項目</th><th>金額</th><th>狀態</th></tr>
  ${pays.map(p => `<tr><td class="n">${md(p.date)}</td><td>${p.vendor}</td><td>${p.item}</td>
    <td class="n">${money(p.amount)}</td>
    <td>${p.paid ? '<span class="tag ok">已給</span>' : '<span class="tag wait">待給</span>'}</td></tr>`).join("")}
</table>
<div class="fee">
  <div>前半 <b>$1,000</b></div>
  <div>後半 <b>$1,000</b></div>
  <div>每家線上會議 <b>${MAX_MEET} 次</b>（1小時/次），超過另計</div>
</div>`;

}

// 分頁
$("nav").onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === t));
};
const sc = document.createElement("script");
sc.src = "data.js?t=" + Date.now();
sc.onload = render;
document.head.appendChild(sc);
</script>
</body>
</html>
